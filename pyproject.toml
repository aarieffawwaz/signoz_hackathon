[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statefold"
version = "0.2.0"
description = "A framework-agnostic, event-sourced state platform for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Joshua" }]
keywords = ["agents", "state", "event-sourcing", "langgraph", "crewai", "agno", "mcp"]
dependencies = []

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=1"]
agno = ["agno>=2"]
mcp = ["mcp>=1.0"]
ui = ["starlette>=0.40", "uvicorn>=0.30"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "asyncpg>=0.29", "langgraph>=0.2", "crewai>=1", "agno>=2", "mcp>=1.0", "starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27", "opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]

[project.scripts]
statefold-demo = "statefold.demo:main"
statefold-mcp = "statefold.mcp_server:main"
statefold-mcp-proxy = "statefold.mcp_proxy:main"
statefold-ui = "statefold.ui:main"
statefold-eval = "statefold.promptfoo:main"

[tool.hatch.build.targets.wheel]
packages = ["statefold"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
